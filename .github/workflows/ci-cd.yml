name: Client CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Continuous Integration: Linting, Type Checking & Production Build
  # =========================================================================
  ci-quality-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # =========================================================================
  # 2. Visual Regression: Playwright archives -> Chromatic
  # =========================================================================
  visual-tests:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    needs: ci-quality-and-build
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Chromatic needs full history to find the baseline commit.
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Publish to Chromatic
        run: npm run chromatic -- --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Archive Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =========================================================================
  # 3. Continuous Delivery / Deployment Stage (SSH to Contabo)
  # =========================================================================
  cd-deploy:
    name: Deploy Client to Contabo Server
    runs-on: ubuntu-latest
    needs: [ci-quality-and-build, visual-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to Contabo
        uses: appleboy/ssh-action@v1.2.2
        if: env.DEPLOY_KEY != ''
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
        with:
          host: "13.140.141.131"
          username: "root"
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "Deploying Client on Contabo (13.140.141.131)..."
            cd /opt/apps/sortpi/client
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Client Deployment Completed Successfully!"

