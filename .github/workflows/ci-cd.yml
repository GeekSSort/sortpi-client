name: Client CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Continuous Integration: Linting, Type Checking & Production Build
  # =========================================================================
  ci-quality-and-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-output
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 7

  # =========================================================================
  # 2. Visual Regression: Playwright archives -> Chromatic
  # =========================================================================
  visual-tests:
    name: Visual Regression (Chromatic)
    runs-on: ubuntu-latest
    needs: ci-quality-and-build
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Chromatic needs full history to find the baseline commit.
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Publish to Chromatic
        run: npm run chromatic -- --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Archive Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =========================================================================
  # 3. Continuous Delivery / Deployment Stage (SSH to Contabo)
  # =========================================================================
  cd-deploy:
    name: Deploy Client to Contabo Server
    runs-on: ubuntu-latest
    needs: [ci-quality-and-build, visual-tests]
    if: github.ref == 'refs/heads/main'

    # Job level, NOT step level. A step's own `env:` block is not in scope for
    # that same step's `if:` — the condition is evaluated before the step's
    # environment is built, so `env.DEPLOY_KEY` read as empty, `'' != ''` was
    # false, and the deploy step was skipped on every run. A job whose only
    # step is skipped still succeeds, so CI/CD went green while nothing was
    # ever deployed. Declared here, the guard sees the value it is guarding.
    #
    # `secrets` cannot be used in a step `if` at all, which is why this goes
    # through `env` rather than testing the secret directly.
    env:
      DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}

    steps:
      # Green used to mean "deployed" and "no key configured" alike. If the
      # key is missing on main that is a broken deployment, not a state to
      # pass quietly, so say which one is missing and stop.
      - name: Require a deploy key
        if: env.DEPLOY_KEY == ''
        run: |
          echo "::error::No SSH deploy key. Set SSH_PRIVATE_KEY (or SERVER_SSH_KEY) in repository secrets."
          exit 1

      - name: Deploy via SSH to Contabo
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: "13.140.141.131"
          username: "root"
          key: ${{ env.DEPLOY_KEY }}
          port: 22
          # Without this the action runs the script without `set -e`: a failed
          # `git pull` or a broken build would scroll past, the closing echo
          # would still exit 0, and the job would report a deployment that did
          # not happen — the same false green as the skipped step above.
          script_stop: true
          script: |
            echo "Deploying Client on Contabo (13.140.141.131)..."
            cd /opt/apps/sortpi/client
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Client Deployment Completed Successfully!"

